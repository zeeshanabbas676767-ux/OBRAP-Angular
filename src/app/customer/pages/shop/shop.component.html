<!-- Single Page Header start -->
<div class="container-fluid page-header py-5">
    <h1 class="text-center text-white display-6">Shop</h1>
    <ol class="breadcrumb justify-content-center mb-0">
        <li class="breadcrumb-item"><a href="#">Home</a></li>
        <li class="breadcrumb-item"><a href="#">Pages</a></li>
        <li class="breadcrumb-item active text-white">Shop</li>
    </ol>
</div>
<!-- Single Page Header End -->

<!-- Fruits Shop Start-->
<div class="container-fluid fruite py-5">
    <div class="container py-5">
        <h1 class="mb-4">Fresh products shop</h1>
        <div class="row g-4">
            <div class="col-lg-12">
                <div class="row g-4">
                    <!-- Search Bar (Optional or static placeholder) -->
                    <div class="col-xl-3">
                        <div class="input-group w-100 mx-auto d-flex">
                            <input type="search" class="form-control p-3" placeholder="Keywords" aria-describedby="search-icon-1">
                            <span id="search-icon-1" class="input-group-text p-3"><i class="fa fa-search"></i></span>
                        </div>
                    </div>
                    <div class="col-6"></div>
                    <!-- Sorting Dropdown Connected to TS -->
                    <div class="col-xl-3">
                        <div class="bg-light ps-3 py-3 rounded d-flex justify-content-between align-items-center mb-4">
                            <label for="sortSelect" class="mb-0 fw-semibold">Sorting:</label>
                            <select id="sortSelect" 
                                    class="border-0 form-select-sm bg-light me-3 shadow-none"
                                    [(ngModel)]="selectedSort"
                                    (ngModelChange)="onSortChange($event)">
                                <option value="">Nothing</option>
                                <option value="priceAsc">Price Low → High</option>
                                <option value="priceDesc">Price High → Low</option>
                                <option value="newest">Newest</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row g-4">
                    <!-- Sidebar Filters -->
                    <div class="col-lg-3">
                        <div class="row g-4">
                            <!-- Categories Dynamic List -->
                            <div class="col-lg-12">
                                <div class="mb-3">
                                    <h4>Categories</h4>
                                    <ul class="list-unstyled fruite-categorie">
                                        <li>
                                            <div class="d-flex justify-content-between fruite-name py-2" 
                                                 style="cursor: pointer;"
                                                 (click)="filterByCategory('All')">
                                                <a [class.fw-bold]="activeCategory === 'All'" class="text-decoration-none text-dark">
                                                    <i class="fas fa-apple-alt me-2 text-secondary"></i>All Products
                                                </a>
                                            </div>
                                        </li>
                                        <div style="height: 200px; max-height: 250px; overflow: auto;">
                                        <li *ngFor="let category of categories">
                                            <div class="d-flex justify-content-between fruite-name py-2"
                                                 style="cursor: pointer;"
                                                 (click)="filterByCategory(category)">
                                                <a [class.fw-bold]="activeCategory === category" class="text-decoration-none text-dark">
                                                    <i class="fas fa-apple-alt me-2 text-secondary"></i>{{ category }}
                                                </a>
                                            </div>
                                        </li>
                                        </div>
                                    </ul>
                                </div>
                            </div>

                            <!-- Price Filter -->
                            <div class="col-lg-12">
                                <div class="mb-3">
                                    <h4 class="mb-2">Price Range (Rs.)</h4>
                                    <div class="d-flex gap-2 mb-2">
                                        <input type="number" class="form-control form-control-sm" [(ngModel)]="minPrice" placeholder="Min">
                                        <input type="number" class="form-control form-control-sm" [(ngModel)]="maxPrice" placeholder="Max">
                                    </div>
                                    <button class="btn btn-secondary btn-sm w-100 mt-2" 
                                            (click)="applyPriceFilter(minPrice || 0, maxPrice || 1000000)">
                                        Apply Filter
                                    </button>
                                    <button class="btn btn-outline-secondary btn-sm w-100 mt-1" 
                                            (click)="resetFilters()">
                                        Reset Filters
                                    </button>
                                </div>
                            </div>

                            <!-- Static Banner / Extra Sidebar content from template -->
                            <div class="col-lg-12">
                                <div class="position-relative">
                                    <img src="assets/template-user/img/banner-fruits.jpg" class="img-fluid w-100 rounded" alt="Banner">
                                    <div class="position-absolute" style="top: 50%; right: 10px; transform: translateY(-50%);">
                                        <h3 class="text-secondary fw-bold">Fresh <br> Products <br> Banner</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Products Grid Area -->
                    <div class="col-lg-9">
                        <div class="row g-4 justify-content-center">
                            
                            <!-- Dynamic Products Loop -->
                            <div class="col-md-6 col-lg-6 col-xl-4" *ngFor="let product of filteredProducts">
                                <div class="rounded position-relative fruite-item border border-secondary border-top-0 rounded-bottom h-100 d-flex flex-column">
                                    <div class="fruite-img overflow-hidden" style="height: 200px;">
                                        <img [src]="product.imageUrl" [alt]="product.name" class="img-fluid w-100 h-100 object-fit-cover rounded-top">
                                    </div>
                                    <div class="text-white bg-secondary px-3 py-1 rounded position-absolute" style="top: 10px; left: 10px;">
                                        {{ product.categoryName }}
                                    </div>
                                    <div class="p-4 rounded-bottom d-flex flex-column flex-grow-1 justify-content-between bg-white">
                                        <div>
                                            <h4 class="text-truncate">{{ product.name }}</h4>
                                            <p class="text-muted small">High quality products available for your daily needs.</p>
                                        </div>
                                        <div class="d-flex justify-content-between align-items-center mt-3">
                                            <p class="text-dark fs-5 fw-bold mb-0">Rs. {{ product.price }}</p>
                                            <button class="btn border border-secondary rounded-pill px-3 text-primary"
                                                    routerLink="/cart"
                                                    (click)="addToCart(product)">
                                                <i class="fa fa-shopping-bag me-2 text-primary"></i> Add to cart
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Pagination Controls -->
                            <div class="col-12" *ngIf="totalPages > 1">
                                <div class="pagination d-flex justify-content-center mt-5">
                                    <a href="javascript:void(0)" class="rounded" (click)="previousPage()" [class.disabled]="pageNumber === 1">&laquo;</a>
                                    
                                    <a href="javascript:void(0)" 
                                       class="rounded" 
                                       *ngFor="let page of getVisiblePages()" 
                                       [class.active]="pageNumber === page"
                                       (click)="goToPage(page)">
                                        {{ page }}
                                    </a>

                                    <a href="javascript:void(0)" class="rounded" (click)="nextPage()" [class.disabled]="pageNumber === totalPages">&raquo;</a>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Fruits Shop End-->
